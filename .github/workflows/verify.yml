name: Offline trace checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Build, verify and publish offline bundle
        shell: pwsh
        run: |
          python tools/check_corpus.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/TraceChecks -c Release -- fixtures/cases.json artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/TraceCli -c Release --no-self-contained -p:UseAppHost=false -o artifacts/package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_cli.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Set-Content -Encoding utf8 artifacts/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: settlement-trace-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
